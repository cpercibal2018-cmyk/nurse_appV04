<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 479" width="554" height="479" role="img" aria-label="Attendance and gaps" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="277" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">Attendance and gaps</text><rect x="117" y="48" width="320" height="55" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="277" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="277" y="85" text-anchor="middle" font-size="13" fill="#0f3024">Published shift</text><polyline points="277,103 277,131" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="131" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="151" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="277" y="168" text-anchor="middle" font-size="13" fill="#1f2933">Clock-in arrives from the badge system</text><polyline points="277,186 277,214" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="214" width="320" height="41" rx="4" fill="#fff4dc" stroke="#d99a1e" stroke-width="2" stroke-dasharray="5 3"/><text x="277" y="237" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d00">Classified</text><polyline points="277,255 277,269 143,269 143,303" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="106" y="272" width="74" height="16" rx="3" fill="#ffffff"/><text x="143" y="284" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Clocked in</text><rect x="18" y="303" width="250" height="58" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="143" y="326" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">PRESENT (or ON DUTY BUT</text><text x="143" y="343" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">INELIGIBLE)</text><polyline points="277,255 277,269 411,269 411,303" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="370.8" y="272" width="80.4" height="16" rx="3" fill="#ffffff"/><text x="411" y="284" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">No clock-in</text><rect x="286" y="303" width="250" height="55" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="411" y="323" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="411" y="340" text-anchor="middle" font-size="13" fill="#1f2933">30 minutes after start: MISSING</text><polyline points="411,358 411,386" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="286" y="386" width="250" height="75" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="411" y="409" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Critical alert to unit</text><text x="411" y="426" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">supervisors (checked every 15</text><text x="411" y="443" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">min)</text></svg>
