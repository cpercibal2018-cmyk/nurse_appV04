<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 396" width="554" height="396" role="img" aria-label="Granting a role" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="277" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">Granting a role</text><rect x="117" y="48" width="320" height="72" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="277" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="277" y="85" text-anchor="middle" font-size="13" fill="#0f3024">Role assignments → Grant role: account,</text><text x="277" y="102" text-anchor="middle" font-size="13" fill="#0f3024">role, scope, reason (20+)</text><polyline points="277,120 277,148" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="148" width="320" height="41" rx="4" fill="#fff4dc" stroke="#d99a1e" stroke-width="2" stroke-dasharray="5 3"/><text x="277" y="171" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d00">Which role?</text><polyline points="277,189 277,203 143,203 143,237" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="-12.400000000000006" y="206" width="310.8" height="16" rx="3" fill="#ffffff"/><text x="143" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Supervisor, or HR Admin for units / departments</text><rect x="18" y="237" width="250" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="143" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Applied at once</text><polyline points="277,189 277,203 411,203 411,237" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="281.2" y="206" width="259.6" height="16" rx="3" fill="#ffffff"/><text x="411" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">System Admin, or HR Admin hospital-wide</text><rect x="286" y="237" width="250" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="411" y="257" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="411" y="274" text-anchor="middle" font-size="13" fill="#1f2933">PENDING: a second administrator</text><text x="411" y="291" text-anchor="middle" font-size="13" fill="#1f2933">approves</text><polyline points="411,309 411,337" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="286" y="337" width="250" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="411" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Applied after approval</text></svg>
