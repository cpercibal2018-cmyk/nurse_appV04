<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 356 590" width="356" height="590" role="img" aria-label="Adding a credential" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="178" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">Adding a credential</text><rect x="18" y="48" width="320" height="72" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="178" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">EMPLOYEE</text><text x="178" y="85" text-anchor="middle" font-size="13" fill="#0f3024">My Credentials → Add credential: type +</text><text x="178" y="102" text-anchor="middle" font-size="13" fill="#0f3024">details</text><polyline points="178,120 178,148" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="148" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="168" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">EMPLOYEE</text><text x="178" y="185" text-anchor="middle" font-size="13" fill="#1f2933">Evidence → upload the document (scanned for</text><text x="178" y="202" text-anchor="middle" font-size="13" fill="#1f2933">viruses)</text><polyline points="178,220 178,248" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="248" width="320" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="178" y="268" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="178" y="285" text-anchor="middle" font-size="13" fill="#1f2933">Pending verification — in the HR review</text><text x="178" y="302" text-anchor="middle" font-size="13" fill="#1f2933">queue</text><polyline points="178,320 178,348" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="348" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="368" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="385" text-anchor="middle" font-size="13" fill="#1f2933">HR opens the evidence and clicks Verify</text><polyline points="178,403 178,431" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="431" width="320" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="178" y="451" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="178" y="468" text-anchor="middle" font-size="13" fill="#1f2933">Valid / Expiring soon / Expired, from the</text><text x="178" y="485" text-anchor="middle" font-size="13" fill="#1f2933">expiry date</text><polyline points="178,503 178,531" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="531" width="320" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="178" y="554" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Eligibility re-evaluated at once</text></svg>
