<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 545" width="554" height="545" role="img" aria-label="Contract approval" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="277" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">Contract approval</text><rect x="117" y="48" width="320" height="55" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="277" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="277" y="85" text-anchor="middle" font-size="13" fill="#0f3024">New contract or Renew contract → Draft</text><polyline points="277,103 277,131" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="131" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="151" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="277" y="168" text-anchor="middle" font-size="13" fill="#1f2933">Upload the signed copy (PDF, scanned clean)</text><polyline points="277,186 277,214" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="214" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="234" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="277" y="251" text-anchor="middle" font-size="13" fill="#1f2933">Submit → Pending approval</text><polyline points="277,269 277,297" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="297" width="320" height="41" rx="4" fill="#fff4dc" stroke="#d99a1e" stroke-width="2" stroke-dasharray="5 3"/><text x="277" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d00">A different HR administrator decides</text><polyline points="277,338 277,352 143,352 143,386" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="115.6" y="355" width="54.800000000000004" height="16" rx="3" fill="#ffffff"/><text x="143" y="367" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Approve</text><rect x="18" y="386" width="250" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="143" y="406" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="143" y="423" text-anchor="middle" font-size="13" fill="#1f2933">Active (covers today) or Approved</text><text x="143" y="440" text-anchor="middle" font-size="13" fill="#1f2933">(starts later)</text><polyline points="143,458 143,486" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="486" width="250" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="143" y="509" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Eligibility re-evaluated at once</text><polyline points="277,338 277,352 411,352 411,386" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="358" y="355" width="106" height="16" rx="3" fill="#ffffff"/><text x="411" y="367" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Return (reason)</text><rect x="286" y="386" width="250" height="58" rx="18" fill="#fdecec" stroke="#b3261e" stroke-width="1.4"/><text x="411" y="409" text-anchor="middle" font-size="13" fill="#7a1712">Back to Draft: correct and submit</text><text x="411" y="426" text-anchor="middle" font-size="13" fill="#7a1712">again</text></svg>
