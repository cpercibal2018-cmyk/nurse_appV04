<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 356 390" width="356" height="390" role="img" aria-label="Signing in" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="178" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">Signing in</text><rect x="18" y="48" width="320" height="55" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="178" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">EMPLOYEE</text><text x="178" y="85" text-anchor="middle" font-size="13" fill="#0f3024">Open the website; enter e-mail and password</text><polyline points="178,103 178,131" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="131" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="151" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">EMPLOYEE</text><text x="178" y="168" text-anchor="middle" font-size="13" fill="#1f2933">Two-factor code (or set-up, if your role</text><text x="178" y="185" text-anchor="middle" font-size="13" fill="#1f2933">requires it)</text><polyline points="178,203 178,231" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="231" width="320" height="55" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="178" y="251" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="178" y="268" text-anchor="middle" font-size="13" fill="#1f2933">The menu shows the pages your role can use</text><polyline points="178,286 178,314" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="314" width="320" height="58" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="178" y="337" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Sign out from the menu at the top right when</text><text x="178" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">you finish</text></svg>
