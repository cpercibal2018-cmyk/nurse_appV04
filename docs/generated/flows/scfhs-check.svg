<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 513" width="702" height="513" role="img" aria-label="SCFHS licence check" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="351" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">SCFHS licence check</text><rect x="191" y="48" width="320" height="55" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="351" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="351" y="85" text-anchor="middle" font-size="13" fill="#0f3024">Credentials → SCFHS → Check with SCFHS now</text><polyline points="351,103 351,131" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="191" y="131" width="320" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="351" y="151" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="351" y="168" text-anchor="middle" font-size="13" fill="#1f2933">SCFHS answers: Valid, Expired, Suspended,</text><text x="351" y="185" text-anchor="middle" font-size="13" fill="#1f2933">Revoked, Not found or Unreachable</text><polyline points="351,203 351,231" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="191" y="231" width="320" height="41" rx="4" fill="#fff4dc" stroke="#d99a1e" stroke-width="2" stroke-dasharray="5 3"/><text x="351" y="254" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d00">Compared with the record</text><polyline points="351,272 351,286 123,286 123,320" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="95.6" y="289" width="54.800000000000004" height="16" rx="3" fill="#ffffff"/><text x="123" y="301" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Matches</text><rect x="18" y="320" width="210" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="123" y="343" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Nothing to do</text><polyline points="351,272 351,286 351,286 351,320" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="285.2" y="289" width="131.60000000000002" height="16" rx="3" fill="#ffffff"/><text x="351" y="301" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Differs / not found</text><rect x="246" y="320" width="210" height="89" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="351" y="340" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="351" y="357" text-anchor="middle" font-size="13" fill="#1f2933">HR notified (or</text><text x="351" y="374" text-anchor="middle" font-size="13" fill="#1f2933">auto-suspended if the type</text><text x="351" y="391" text-anchor="middle" font-size="13" fill="#1f2933">says so)</text><polyline points="351,409 351,437" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="246" y="437" width="210" height="58" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="351" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">HR checks the evidence and</text><text x="351" y="477" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">corrects the record</text><polyline points="351,272 351,286 579,286 579,320" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="538.8" y="289" width="80.4" height="16" rx="3" fill="#ffffff"/><text x="579" y="301" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Unreachable</text><rect x="474" y="320" width="210" height="41" rx="18" fill="#fdecec" stroke="#b3261e" stroke-width="1.4"/><text x="579" y="343" text-anchor="middle" font-size="13" fill="#7a1712">Logged; try again later</text></svg>
