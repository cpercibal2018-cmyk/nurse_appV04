<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 779" width="554" height="779" role="img" aria-label="Credential renewal" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="277" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">Credential renewal</text><rect x="117" y="48" width="320" height="72" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="277" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">EMPLOYEE</text><text x="277" y="85" text-anchor="middle" font-size="13" fill="#0f3024">My Credentials → Renew (Valid, Expiring soon</text><text x="277" y="102" text-anchor="middle" font-size="13" fill="#0f3024">or Expired)</text><polyline points="277,120 277,148" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="148" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="168" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">EMPLOYEE</text><text x="277" y="185" text-anchor="middle" font-size="13" fill="#1f2933">Enter the new details, including the new</text><text x="277" y="202" text-anchor="middle" font-size="13" fill="#1f2933">expiry date</text><polyline points="277,220 277,248" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="248" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="268" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">EMPLOYEE</text><text x="277" y="285" text-anchor="middle" font-size="13" fill="#1f2933">Evidence → upload the new document</text><polyline points="277,303 277,331" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="331" width="320" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="277" y="351" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="277" y="368" text-anchor="middle" font-size="13" fill="#1f2933">Renewal under review — in the HR review</text><text x="277" y="385" text-anchor="middle" font-size="13" fill="#1f2933">queue</text><polyline points="277,403 277,431" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="431" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="451" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="277" y="468" text-anchor="middle" font-size="13" fill="#1f2933">HR reviews the staged details and the new</text><text x="277" y="485" text-anchor="middle" font-size="13" fill="#1f2933">evidence</text><polyline points="277,503 277,531" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="531" width="320" height="41" rx="4" fill="#fff4dc" stroke="#d99a1e" stroke-width="2" stroke-dasharray="5 3"/><text x="277" y="554" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d00">HR decides</text><polyline points="277,572 277,586 143,586 143,620" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="90" y="589" width="106" height="16" rx="3" fill="#ffffff"/><text x="143" y="601" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Approve renewal</text><rect x="18" y="620" width="250" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="143" y="640" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="143" y="657" text-anchor="middle" font-size="13" fill="#1f2933">New details and evidence take</text><text x="143" y="674" text-anchor="middle" font-size="13" fill="#1f2933">effect; any grace closes</text><polyline points="143,692 143,720" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="720" width="250" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="143" y="743" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Eligibility re-evaluated</text><polyline points="277,572 277,586 411,586 411,620" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="358" y="589" width="106" height="16" rx="3" fill="#ffffff"/><text x="411" y="601" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Reject (reason)</text><rect x="286" y="620" width="250" height="58" rx="18" fill="#fdecec" stroke="#b3261e" stroke-width="1.4"/><text x="411" y="643" text-anchor="middle" font-size="13" fill="#7a1712">Staged details cleared; the</text><text x="411" y="660" text-anchor="middle" font-size="13" fill="#7a1712">approved record is unchanged</text></svg>
