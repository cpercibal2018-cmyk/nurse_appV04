<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 496" width="702" height="496" role="img" aria-label="Configuring a credential requirement" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="351" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">Configuring a credential requirement</text><rect x="191" y="48" width="320" height="55" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="351" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="351" y="85" text-anchor="middle" font-size="13" fill="#0f3024">Credentials → Requirements → Add requirement</text><polyline points="351,103 351,131" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="191" y="131" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="351" y="151" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="351" y="168" text-anchor="middle" font-size="13" fill="#1f2933">Unit + position (blank = all) + credential</text><text x="351" y="185" text-anchor="middle" font-size="13" fill="#1f2933">type + policy</text><polyline points="351,203 351,231" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="191" y="231" width="320" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="351" y="251" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="351" y="268" text-anchor="middle" font-size="13" fill="#1f2933">Saved; every affected nurse re-evaluated at</text><text x="351" y="285" text-anchor="middle" font-size="13" fill="#1f2933">once</text><polyline points="351,303 351,331" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="191" y="331" width="320" height="41" rx="4" fill="#fff4dc" stroke="#d99a1e" stroke-width="2" stroke-dasharray="5 3"/><text x="351" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d00">Policy</text><polyline points="351,372 351,386 123,386 123,420" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="89.2" y="389" width="67.6" height="16" rx="3" fill="#ffffff"/><text x="123" y="401" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">MANDATORY</text><rect x="18" y="420" width="210" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="123" y="443" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Missing = INELIGIBLE</text><polyline points="351,372 351,386 351,386 351,420" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="314" y="389" width="74" height="16" rx="3" fill="#ffffff"/><text x="351" y="401" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">TRANSITION</text><rect x="246" y="420" width="210" height="58" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="351" y="443" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Warning until the deadline,</text><text x="351" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">then blocks</text><polyline points="351,372 351,386 579,386 579,420" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="548.4" y="389" width="61.2" height="16" rx="3" fill="#ffffff"/><text x="579" y="401" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">OPTIONAL</text><rect x="474" y="420" width="210" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="579" y="443" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Never affects eligibility</text></svg>
