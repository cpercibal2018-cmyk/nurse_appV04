<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 356 622" width="356" height="622" role="img" aria-label="Resolving an ineligible nurse" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="178" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">Resolving an ineligible nurse</text><rect x="18" y="48" width="320" height="55" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="178" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="85" text-anchor="middle" font-size="13" fill="#0f3024">Open Eligibility; filter Ineligible</text><polyline points="178,103 178,131" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="131" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="151" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="168" text-anchor="middle" font-size="13" fill="#1f2933">Select the nurse and read the red reasons</text><polyline points="178,186 178,214" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="214" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="234" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="251" text-anchor="middle" font-size="13" fill="#1f2933">Identify the root cause (contract,</text><text x="178" y="268" text-anchor="middle" font-size="13" fill="#1f2933">credential, unit, position)</text><polyline points="178,286 178,314" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="314" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="334" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="351" text-anchor="middle" font-size="13" fill="#1f2933">Correct the source record on its own page</text><polyline points="178,369 178,397" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="397" width="320" height="55" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="178" y="417" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="178" y="434" text-anchor="middle" font-size="13" fill="#1f2933">Eligibility recalculated automatically</text><polyline points="178,452 178,480" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="480" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="500" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="517" text-anchor="middle" font-size="13" fill="#1f2933">Check the new result on Eligibility</text><polyline points="178,535 178,563" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="563" width="320" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="178" y="586" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Return to Scheduling</text></svg>
