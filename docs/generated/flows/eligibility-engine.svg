<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 796" width="810" height="796" role="img" aria-label="How eligibility is decided" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="405" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">How eligibility is decided</text><rect x="245" y="48" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="405" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="405" y="85" text-anchor="middle" font-size="13" fill="#1f2933">1. Employee exists, not deleted, status</text><text x="405" y="102" text-anchor="middle" font-size="13" fill="#1f2933">Active</text><polyline points="405,120 405,148" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="245" y="148" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="405" y="168" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="405" y="185" text-anchor="middle" font-size="13" fill="#1f2933">2. Position is schedulable</text><polyline points="405,203 405,231" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="245" y="231" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="405" y="251" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="405" y="268" text-anchor="middle" font-size="13" fill="#1f2933">3. An Approved or Active contract covers the</text><text x="405" y="285" text-anchor="middle" font-size="13" fill="#1f2933">date</text><polyline points="405,303 405,331" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="245" y="331" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="405" y="351" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="405" y="368" text-anchor="middle" font-size="13" fill="#1f2933">4. Employee has a unit (no requirements →</text><text x="405" y="385" text-anchor="middle" font-size="13" fill="#1f2933">allowed, with a note)</text><polyline points="405,403 405,431" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="245" y="431" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="405" y="451" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="405" y="468" text-anchor="middle" font-size="13" fill="#1f2933">5. Each required credential: verified,</text><text x="405" y="485" text-anchor="middle" font-size="13" fill="#1f2933">issued, not expired on the date</text><polyline points="405,503 405,531" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="245" y="531" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="405" y="551" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="405" y="568" text-anchor="middle" font-size="13" fill="#1f2933">6. If not: grace → waiver → transition</text><text x="405" y="585" text-anchor="middle" font-size="13" fill="#1f2933">deadline → else block</text><polyline points="405,603 405,631" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="245" y="631" width="320" height="41" rx="4" fill="#fff4dc" stroke="#d99a1e" stroke-width="2" stroke-dasharray="5 3"/><text x="405" y="654" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d00">Result</text><polyline points="405,672 405,686 108,686 108,720" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="58.199999999999996" y="689" width="99.60000000000001" height="16" rx="3" fill="#ffffff"/><text x="108" y="701" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Nothing blocks</text><rect x="18" y="720" width="180" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="108" y="743" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">ELIGIBLE</text><polyline points="405,672 405,686 306,686 306,720" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="269" y="689" width="74" height="16" rx="3" fill="#ffffff"/><text x="306" y="701" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Grace used</text><rect x="216" y="720" width="180" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="306" y="743" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">ELIGIBLE WITH GRACE</text><polyline points="405,672 405,686 504,686 504,720" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="447.8" y="689" width="112.4" height="16" rx="3" fill="#ffffff"/><text x="504" y="701" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Transition unmet</text><rect x="414" y="720" width="180" height="58" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="504" y="743" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">ELIGIBLE WITH POLICY</text><text x="504" y="760" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">WARNING</text><polyline points="405,672 405,686 702,686 702,720" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="649" y="689" width="106" height="16" rx="3" fill="#ffffff"/><text x="702" y="701" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Anything blocks</text><rect x="612" y="720" width="180" height="41" rx="18" fill="#fdecec" stroke="#b3261e" stroke-width="1.4"/><text x="702" y="743" text-anchor="middle" font-size="13" fill="#7a1712">INELIGIBLE</text></svg>
