<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 413" width="702" height="413" role="img" aria-label="Personal-data request (PDPL)" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="351" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">Personal-data request (PDPL)</text><rect x="191" y="48" width="320" height="72" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="351" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">EMPLOYEE</text><text x="351" y="85" text-anchor="middle" font-size="13" fill="#0f3024">My data → New request (or HR logs one</text><text x="351" y="102" text-anchor="middle" font-size="13" fill="#0f3024">received on paper)</text><polyline points="351,120 351,148" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="191" y="148" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="351" y="168" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="351" y="185" text-anchor="middle" font-size="13" fill="#1f2933">HR: Start review (answer due within 30 days)</text><polyline points="351,203 351,231" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="191" y="231" width="320" height="41" rx="4" fill="#fff4dc" stroke="#d99a1e" stroke-width="2" stroke-dasharray="5 3"/><text x="351" y="254" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d00">Request type</text><polyline points="351,272 351,286 123,286 123,320" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="54" y="289" width="138" height="16" rx="3" fill="#ffffff"/><text x="123" y="301" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Access / portability</text><rect x="18" y="320" width="210" height="58" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="123" y="343" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Approve: package</text><text x="123" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">downloadable for 30 days</text><polyline points="351,272 351,286 351,286 351,320" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="314" y="289" width="74" height="16" rx="3" fill="#ffffff"/><text x="351" y="301" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Correction</text><rect x="246" y="320" width="210" height="75" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="351" y="343" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Approve, correct the</text><text x="351" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">record, Complete with a</text><text x="351" y="377" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">note</text><polyline points="351,272 351,286 579,286 579,320" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="551.6" y="289" width="54.800000000000004" height="16" rx="3" fill="#ffffff"/><text x="579" y="301" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Erasure</text><rect x="474" y="320" width="210" height="58" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="579" y="343" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">A System Admin (not the</text><text x="579" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">logger) erases</text></svg>
