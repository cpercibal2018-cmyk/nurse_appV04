<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 869" width="740" height="869" role="img" aria-label="How the hospital system works" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="370" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">How the hospital system works</text><line x1="18" y1="68" x2="338" y2="68" stroke="#1f6b4f" stroke-width="1"/><text x="178" y="62" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#1f6b4f">HOSPITAL MASTER DATA</text><polyline points="178,72 178,100" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="100" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="120" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="137" text-anchor="middle" font-size="13" fill="#1f2933">Departments → Units → Beds</text><polyline points="178,155 178,183" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="183" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="203" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="220" text-anchor="middle" font-size="13" fill="#1f2933">Positions (schedulable or not)</text><polyline points="178,238 178,266" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="266" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="286" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="303" text-anchor="middle" font-size="13" fill="#1f2933">Credential catalogue (four-eyes)</text><polyline points="178,321 178,349" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="349" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="369" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="386" text-anchor="middle" font-size="13" fill="#1f2933">Credential requirements per unit and</text><text x="178" y="403" text-anchor="middle" font-size="13" fill="#1f2933">position</text><polyline points="178,421 178,449" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="18" y1="469" x2="338" y2="469" stroke="#1f6b4f" stroke-width="1"/><text x="178" y="463" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#1f6b4f">NURSE / EMPLOYEE</text><polyline points="178,473 178,501" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="501" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="521" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="538" text-anchor="middle" font-size="13" fill="#1f2933">Onboard the nurse (employee + Draft</text><text x="178" y="555" text-anchor="middle" font-size="13" fill="#1f2933">contract)</text><polyline points="178,573 178,601" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="601" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="621" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="638" text-anchor="middle" font-size="13" fill="#1f2933">Contract approved by a second HR</text><text x="178" y="655" text-anchor="middle" font-size="13" fill="#1f2933">administrator</text><polyline points="178,673 178,701" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="701" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="721" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">EMPLOYEE</text><text x="178" y="738" text-anchor="middle" font-size="13" fill="#1f2933">Credentials recorded with evidence</text><polyline points="178,756 178,784" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="784" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="804" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="821" text-anchor="middle" font-size="13" fill="#1f2933">Verification by HR / SCFHS check</text><line x1="402" y1="68" x2="722" y2="68" stroke="#1f6b4f" stroke-width="1"/><text x="562" y="62" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#1f6b4f">ELIGIBILITY</text><polyline points="562,72 562,100" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="402" y="100" width="320" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="562" y="120" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="562" y="137" text-anchor="middle" font-size="13" fill="#1f2933">Eligibility calculated for every change and</text><text x="562" y="154" text-anchor="middle" font-size="13" fill="#1f2933">every day</text><polyline points="562,172 562,200" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="402" y1="220" x2="722" y2="220" stroke="#1f6b4f" stroke-width="1"/><text x="562" y="214" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#1f6b4f">WORKFORCE AND ROSTER</text><polyline points="562,224 562,252" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="402" y="252" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="562" y="272" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="562" y="289" text-anchor="middle" font-size="13" fill="#1f2933">Coverage targets per unit and shift</text><polyline points="562,307 562,335" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="402" y="335" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="562" y="355" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SUPERVISOR</text><text x="562" y="372" text-anchor="middle" font-size="13" fill="#1f2933">Supervisor drafts and publishes the roster</text><polyline points="562,390 562,418" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="402" y1="438" x2="722" y2="438" stroke="#1f6b4f" stroke-width="1"/><text x="562" y="432" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#1f6b4f">ON THE DAY</text><polyline points="562,442 562,470" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="402" y="470" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="562" y="490" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="562" y="507" text-anchor="middle" font-size="13" fill="#1f2933">Attendance from the badge system</text><polyline points="562,525 562,553" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="402" y="553" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="562" y="573" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="562" y="590" text-anchor="middle" font-size="13" fill="#1f2933">Monitoring: KPI, gaps, reminders</text><polyline points="562,608 562,636" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="402" y="636" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="562" y="656" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="562" y="673" text-anchor="middle" font-size="13" fill="#1f2933">Notifications to the people who act</text><polyline points="562,691 562,719" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="402" y="719" width="320" height="58" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="562" y="742" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Audit trail and governance (every step</text><text x="562" y="759" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">recorded)</text><polyline points="178,839 178,851 370,851 370,38 562,38 562,48" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/></svg>
