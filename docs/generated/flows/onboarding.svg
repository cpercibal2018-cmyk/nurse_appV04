<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 356 639" width="356" height="639" role="img" aria-label="Onboarding a nurse" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="178" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">Onboarding a nurse</text><rect x="18" y="48" width="320" height="72" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="178" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="85" text-anchor="middle" font-size="13" fill="#0f3024">Nurses → Onboard employee: details +</text><text x="178" y="102" text-anchor="middle" font-size="13" fill="#0f3024">contract dates</text><polyline points="178,120 178,148" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="148" width="320" height="55" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="178" y="168" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="178" y="185" text-anchor="middle" font-size="13" fill="#1f2933">Employee and Draft contract created together</text><polyline points="178,203 178,231" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="231" width="320" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="178" y="251" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="178" y="268" text-anchor="middle" font-size="13" fill="#1f2933">Eligibility: INELIGIBLE (no approved</text><text x="178" y="285" text-anchor="middle" font-size="13" fill="#1f2933">contract yet)</text><polyline points="178,303 178,331" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="331" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="351" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="368" text-anchor="middle" font-size="13" fill="#1f2933">Contracts: upload the signed copy, Submit</text><polyline points="178,386 178,414" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="414" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="434" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="451" text-anchor="middle" font-size="13" fill="#1f2933">A different HR administrator approves</text><polyline points="178,469 178,497" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="497" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="178" y="517" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="178" y="534" text-anchor="middle" font-size="13" fill="#1f2933">Credentials recorded and verified</text><polyline points="178,552 178,580" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="580" width="320" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="178" y="603" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Eligible → can be scheduled in the home unit</text></svg>
