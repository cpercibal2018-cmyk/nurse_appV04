<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 579" width="554" height="579" role="img" aria-label="Approval by a second administrator (four-eyes)" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="277" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">Approval by a second administrator (four-eyes)</text><rect x="117" y="48" width="320" height="72" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="277" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="277" y="85" text-anchor="middle" font-size="13" fill="#0f3024">An administrator submits a protected change</text><text x="277" y="102" text-anchor="middle" font-size="13" fill="#0f3024">with a reason</text><polyline points="277,120 277,148" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="148" width="320" height="55" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="277" y="168" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="277" y="185" text-anchor="middle" font-size="13" fill="#1f2933">PENDING — nothing has changed yet</text><polyline points="277,203 277,231" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="231" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="251" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">HR ADMIN</text><text x="277" y="268" text-anchor="middle" font-size="13" fill="#1f2933">A different authorised administrator reviews</text><text x="277" y="285" text-anchor="middle" font-size="13" fill="#1f2933">it</text><polyline points="277,303 277,331" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="331" width="320" height="41" rx="4" fill="#fff4dc" stroke="#d99a1e" stroke-width="2" stroke-dasharray="5 3"/><text x="277" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d00">Decision (with a reason)</text><polyline points="277,372 277,386 143,386 143,420" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="115.6" y="389" width="54.800000000000004" height="16" rx="3" fill="#ffffff"/><text x="143" y="401" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Approve</text><rect x="18" y="420" width="250" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="143" y="440" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="143" y="457" text-anchor="middle" font-size="13" fill="#1f2933">Re-checked, then applied as the</text><text x="143" y="474" text-anchor="middle" font-size="13" fill="#1f2933">approver</text><polyline points="143,492 143,520" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="520" width="250" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="143" y="543" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Change in force; audited</text><polyline points="277,372 277,386 411,386 411,420" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="386.8" y="389" width="48.400000000000006" height="16" rx="3" fill="#ffffff"/><text x="411" y="401" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Reject</text><rect x="286" y="420" width="250" height="58" rx="18" fill="#fdecec" stroke="#b3261e" stroke-width="1.4"/><text x="411" y="443" text-anchor="middle" font-size="13" fill="#7a1712">Nothing changes; the reason is</text><text x="411" y="460" text-anchor="middle" font-size="13" fill="#7a1712">recorded</text></svg>
