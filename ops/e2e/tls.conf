# Stands in for the regional external HTTPS load balancer (ops/gcp/README.md §6):
# TLS ends here and the client address travels in X-Client-Ip, which the web
# container trusts only from this network (LB_PROXY_SUBNET).

server {
  listen 8443 ssl;
  server_name nurse.e2e.test;
  ssl_certificate     /certs/tls.crt;
  ssl_certificate_key /certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://web:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Client-Ip $remote_addr;
  }
}

# TEST ONLY — production has no plain-HTTP door. It lets the browser test show
# that the Secure cookies are never sent over HTTP.
server {
  listen 8081;
  server_name nurse.e2e.test;

  location / {
    proxy_pass http://web:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Client-Ip $remote_addr;
  }
}
