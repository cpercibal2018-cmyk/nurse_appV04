# HTTPS browser test of the session cookies (legacy B-03). The release images
# run exactly as in production (NODE_ENV=production, runtime DB role, read-only
# containers); only the TLS front and the throwaway database are local.
# Started by ./run.sh — see README.md.

name: nurseapp-e2e

x-db-urls: &db-urls
  DATABASE_URL: postgresql://nurseapp_runtime:${E2E_DB_PASSWORD}@db:5432/nurseapp
  MIGRATION_DATABASE_URL: postgresql://nurseapp_migration:${E2E_DB_PASSWORD}@db:5432/nurseapp

x-hardened: &hardened
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: aigh
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD}
      POSTGRES_DB: nurseapp
      E2E_DB_PASSWORD: ${E2E_DB_PASSWORD}
    volumes:
      - ../db:/ops-db:ro
      - ./db-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      # TCP, not the socket: the temporary init server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aigh -d nurseapp"]
      interval: 2s
      timeout: 5s
      retries: 60

  migrate:
    image: nurseapp/migrate:${TAG}
    environment: *db-urls
    depends_on:
      db: { condition: service_healthy }

  # After every migration: grants again, then verify.sql must pass (db-release.sh).
  grants:
    image: postgres:15-alpine
    environment:
      PGPASSWORD: ${E2E_DB_PASSWORD}
    volumes:
      - ../db:/ops-db:ro
    command: >-
      sh -c "psql -X -q -v ON_ERROR_STOP=1 -h db -U aigh -d nurseapp -f /ops-db/02_grants.sql
      && psql -X -q -v ON_ERROR_STOP=1 -h db -U aigh -d nurseapp -f /ops-db/verify.sql"
    depends_on:
      migrate: { condition: service_completed_successfully }

  # The first administrators, as the runtime role (the CLI only reads a TTY).
  bootstrap:
    image: nurseapp/api:${TAG}
    <<: *hardened
    environment:
      <<: *db-urls
      NODE_ENV: production
      JWT_SECRET: ${E2E_JWT_SECRET}
      E2E_PASSWORD: ${E2E_PASSWORD}
    command:
      - node
      - --input-type=module
      - -e
      - |
        const { bootstrapAdministrators } = await import('/app/backend/dist/cli/bootstrap.js');
        const { createPrisma } = await import('/app/backend/dist/lib/prisma.js');
        const { createPasswordService } = await import('/app/backend/dist/lib/passwords.js');
        const db = createPrisma(process.env.DATABASE_URL);
        const password = process.env.E2E_PASSWORD;
        await bootstrapAdministrators(db, {
          systemAdmin: { email: 'sa@e2e.test', displayName: 'E2E System Admin', password },
          hrAdmin: { email: 'hr@e2e.test', displayName: 'E2E HR Admin', password },
        }, createPasswordService(12));
        await db.$$disconnect();
    depends_on:
      grants: { condition: service_completed_successfully }

  api:
    image: nurseapp/api:${TAG}
    <<: *hardened
    tmpfs: ["/tmp:mode=1777", "/data/storage:uid=1000,gid=1000"]
    environment:
      <<: *db-urls
      NODE_ENV: production
      JWT_SECRET: ${E2E_JWT_SECRET}
      MFA_ENCRYPTION_KEY: ${E2E_MFA_KEY}
      DOCUMENT_ENCRYPTION_KEY: ${E2E_DOC_KEY}
      CORS_ORIGIN: https://nurse.e2e.test:8443
      DATA_RESIDENCY_REGION: me-central-2
      PDPL_ALLOWED_REGIONS: me-central-2
      TRUST_PROXY: "true"
      JOBS_MODE: "off"
      UPLOAD_SCANNER: clamav
      CLAMAV_HOST: clamav        # not started: this test uploads nothing
      # Short enough that the test sees an access token expire and the silent refresh.
      ACCESS_TOKEN_TTL_SECONDS: "20"
    healthcheck: { interval: 2s }   # the image's check, polled faster
    depends_on:
      bootstrap: { condition: service_completed_successfully }

  web:
    image: nurseapp/web:${TAG}
    <<: *hardened
    tmpfs: ["/tmp:uid=101,gid=101", "/var/cache/nginx:uid=101,gid=101", "/etc/nginx/conf.d:uid=101,gid=101"]
    environment:
      LB_PROXY_SUBNET: 172.31.250.0/24
    healthcheck: { interval: 2s }
    depends_on:
      api: { condition: service_healthy }

  tls:
    image: nginx:1.28-alpine
    volumes:
      - ./tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${E2E_CERT_DIR}:/certs:ro
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz >/dev/null"]
      interval: 2s
      retries: 30
    depends_on:
      web: { condition: service_healthy }
