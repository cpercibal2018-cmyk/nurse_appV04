name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aigh
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: nurseapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aigh"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://aigh:ci_password@localhost:5432/nurseapp_test
      TEST_DATABASE_URL: postgresql://aigh:ci_password@localhost:5432/nurseapp_test
      NODE_ENV: test
      # Test-only signing key (CI never issues real sessions).
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The seed imports the custom-output Prisma client, which is not tracked
      # and is not generated by migrate deploy or npm ci on a fresh checkout.
      - name: Generate Prisma client before seeding
        run: npm run db:generate -w backend
      - name: Apply migrations, then verify deployment is idempotent
        run: |
          npm run db:deploy -w backend
          npm run db:deploy -w backend
      - name: Seed twice (reference data must be idempotent)
        run: |
          npm run db:seed -w backend
          npm run db:seed -w backend
      - run: npm run typecheck
      - run: npm test    # backend, frontend, documentation links
      - name: Build backend
        run: |
          if npm run build -w backend > backend-build.log 2>&1; then
            cat backend-build.log
          else
            tail -n 35 backend-build.log
            printf '::error::Backend build: %s\n' "$(tail -n 18 backend-build.log | tr '\n' ' ' | cut -c 1-3500)"
            exit 1
          fi
      - name: Build frontend (includes the gzipped bundle budget gate)
        run: |
          if npm run build -w frontend > frontend-build.log 2>&1; then
            cat frontend-build.log
          else
            tail -n 35 frontend-build.log
            printf '::error::Frontend build: %s\n' "$(tail -n 18 frontend-build.log | tr '\n' ' ' | cut -c 1-3500)"
            exit 1
          fi
