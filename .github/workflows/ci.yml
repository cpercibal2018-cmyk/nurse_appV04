name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aigh
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: nurseapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aigh"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://aigh:ci_password@localhost:5432/nurseapp_test
      TEST_DATABASE_URL: postgresql://aigh:ci_password@localhost:5432/nurseapp_test
      NODE_ENV: test
      # Test-only signing key (CI never issues real sessions).
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply migrations, then re-run to prove there is no drift
        run: |
          npm run db:deploy -w backend
          npm run db:deploy -w backend
      - name: Seed twice (reference data must be idempotent)
        run: |
          npm run db:seed -w backend
          npm run db:seed -w backend
      - run: npm run typecheck
      - run: npm test    # backend, frontend, documentation links
      - name: Build (frontend build includes the gzipped bundle budget gate)
        run: npm run build
