name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aigh
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: nurseapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aigh"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://aigh:ci_password@localhost:5432/nurseapp_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build (frontend build includes the gzipped bundle budget gate)
        run: npm run build
